[project]
name = "animasi-3d"
version = "0.1.0"
description = "Persekitaran pembangunan animasi 3D: Claude Code + Blender (BlendRelay MCP)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "moviepy>=2.1",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "blendrelay-mcp==0.7.8",
]

[dependency-groups]
dev = [
    # Stub autolengkap bpy/mathutils untuk VS Code sahaja (bukan bpy sebenar).
    "fake-bpy-module-4.5",
]

[tool.uv]
package = false
